version: '3'
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080"
    working_dir: /
    volumes:
      - "./server/.env:/.env"
      - "./server/db.sqlite:/db.sqlite"
  nginx:
    build:
      context: .
      dockerfile: front/Dockerfile
    ports:
      - "80:80"
